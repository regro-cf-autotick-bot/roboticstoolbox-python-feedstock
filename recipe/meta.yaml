{% set name = "roboticstoolbox-python" %}
{% set version = "1.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e227d54e91eb1ac808af1a86340b61feaf4a25707bb0a9ff0d1d5ce9822e4a02
  patches:
    - 510.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
  host:
    - pip
    - python
    - numpy
    - setuptools
  run:
    - ansitable
    - matplotlib-base
    - numpy >=1.18.0
    - pgraph-python
    - python
    - qpsolvers
    - rtb-data
    - scipy
    - spatialmath-python >=1.0.0
    - swift-sim >=1.0.0
    - spatialgeometry >=1.0.0
    - sympy
    - bullet >=3.21
    - imageio
    - imageio-ffmpeg
    - vpython                                # [not aarch64]
    - numpy-stl
    - pyyaml
    - progress
    - cryptography
    - colored <1.5.0
    - jupyter

test:
  imports:
    - roboticstoolbox
    - roboticstoolbox.backends
  commands:
    - pip check
    - python -c "import roboticstoolbox as rtb; robot = rtb.models.Panda()"
  requires:
    - pip

about:
  home: https://github.com/petercorke/robotics-toolbox-python
  summary: A Python library for robotic education and research
  dev_url: https://github.com/petercorke/roboticstoolbox-python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
    - petercorke
    - jhavl
